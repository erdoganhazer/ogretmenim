name: Mesaj bildirimleri
# Bildirim kuyruğunu ELLE işleme ve kişiye deneme bildirimi. Asıl iş Firebase fonksiyonunda (kuyrukGonder, kayıt düşer düşmez).
# deneme = kullanıcı adı ya da ad → o kişinin cihazlarına deneme bildirimi. kuru = 1 → göndermez.
on:
  workflow_dispatch:
    inputs:
      kuru: { description: "Göndermeden dene (1)", default: "0" }
      deneme: { description: "Deneme bildirimi gönderilecek kullanıcı adı (ör. hazer); boşsa kuyruk işlenir", default: "" }
permissions: { contents: read }
concurrency: { group: mesaj-bildirim, cancel-in-progress: false }
jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: google-github-actions/auth@v2
        with: { credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
      - run: npm install --no-audit --no-fund
        working-directory: araclar/bildirim
      - run: node mesaj_gonder.mjs
        working-directory: araclar/bildirim
        env: { KURU: "${{ github.event.inputs.kuru || '0' }}", DENEME: "${{ github.event.inputs.deneme || '' }}" }
