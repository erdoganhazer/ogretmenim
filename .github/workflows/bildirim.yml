name: Veli bildirimleri
# Yarım saatte bir: seçtiği saati geçmiş ve bugün bildirim almamış velilere, öğrencinin gününde eksik varsa bildirim gider.
# Not: GitHub, depoda 60 gün hiç değişiklik olmazsa zamanlanmış işleri durdurur; Actions sekmesinden yeniden açılır.
on:
  schedule: [{ cron: "7,37 * * * *" }]
  workflow_dispatch:
    inputs:
      kuru: { description: "Göndermeden dene (1)", default: "0" }
permissions: { contents: read }
concurrency: { group: bildirim, cancel-in-progress: false }
jobs:
  gonder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: google-github-actions/auth@v2
        with: { credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
      - run: npm install --no-audit --no-fund
        working-directory: araclar/bildirim
      - run: node gonder.mjs
        working-directory: araclar/bildirim
        env: { KURU: "${{ github.event.inputs.kuru || '0' }}" }
