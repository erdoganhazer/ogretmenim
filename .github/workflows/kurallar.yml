name: Güvenlik kuralları testi
on:
  push: { paths: ["firestore.rules", "firebase.json", "test/kurallar/**", ".github/workflows/kurallar.yml"] }
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: "kurallar-${{ github.ref }}"
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
        working-directory: test/kurallar
      - run: npx firebase emulators:exec --only firestore --project demo-ogretmenim --config ../../firebase.json "npm test"
        working-directory: test/kurallar

  # Testler yeşilse ve main dalındaysak kuralları Firebase'e yayınlar.
  # Gerekli sır: FIREBASE_SERVICE_ACCOUNT (hizmet hesabının JSON anahtarının tamamı).
  yayinla:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Sır var mı?
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT sırrı tanımlı değil (Settings › Secrets and variables › Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: google-github-actions/auth@v2
        with: { credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
      - name: Kuralları yayınla
        run: npx --yes firebase-tools@13.29.1 deploy --only firestore:rules --project ogretmenim-d0524 --non-interactive
