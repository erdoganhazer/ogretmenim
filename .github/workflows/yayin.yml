name: Yayın (GitHub Pages)
on:
  push: { branches: [main], paths: ["web/**", ".github/workflows/yayin.yml"] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  yayin:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Çevrimdışı dosyasına sürüm ve dosya listesi yazılır: her yayın yeni sürüm olur, yüklü uygulamalar kendiliğinden güncellenir
      - run: python3 araclar/sw_damgala.py web "${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: d
        uses: actions/deploy-pages@v4
